name: FLAMINGO quality and daily monitor
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'
permissions:
  contents: read
jobs:
  quality:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - run: npm run build
  daily-monitor:
    name: Daily production checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: true
      - run: npm run build
      - name: Check live routes and API health
        shell: bash
        run: |
          node <<'NODE'
          const routes = ['/', '/professionals', '/pricing', '/faq', '/api/health'];
          const base = 'https://flamingo-gules.vercel.app';
          (async () => {
            let failed = false;
            for (const route of routes) {
              try {
                const response = await fetch(base + route, { signal: AbortSignal.timeout(15000) });
                const body = await response.text();
                let ok = response.status === 200;
                if (route === '/api/health' && ok) {
                  try {
                    const health = JSON.parse(body);
                    ok = health.status === 'ok' && health.service === 'flamingo-api';
                  } catch { ok = false; }
                }
                console.log((ok ? 'PASS ' : 'FAIL ') + route + ' HTTP ' + response.status);
                if (!ok) failed = true;
              } catch (error) {
                console.error('FAIL ' + route + ': ' + error.message);
                failed = true;
              }
            }
            if (failed) process.exitCode = 1;
          })();
          NODE
      - name: Measure mobile Lighthouse scores
        continue-on-error: true
        env:
          BASE_URL: https://flamingo-gules.vercel.app
        run: |
          mkdir -p monitoring-artifacts
          CHROME_PATH=$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')
          npx --yes lighthouse@13.6.0 "$BASE_URL/" --chrome-path="$CHROME_PATH" --form-factor=mobile --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=monitoring-artifacts/lighthouse.json --quiet
      - name: Add Lighthouse scores to summary
        if: always()
        run: |
          if [ -f monitoring-artifacts/lighthouse.json ]; then
            node -e 'const c=require("./monitoring-artifacts/lighthouse.json").categories; const p=x=>Math.round(x.score*100); console.log("## Mobile Lighthouse scores"); console.log("Performance: "+p(c.performance)+" · Accessibility: "+p(c.accessibility)+" · Best Practices: "+p(c["best-practices"])+" · SEO: "+p(c.seo));' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Mobile Lighthouse scores' >> "$GITHUB_STEP_SUMMARY"
            echo 'No report generated; inspect Lighthouse step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flamingo-daily-monitor-${{ github.run_number }}
          path: |
            playwright-report/
            monitoring-artifacts/
          if-no-files-found: warn
          retention-days: 35
